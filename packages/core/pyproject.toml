[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openferment-core"
version = "0.1.0"
description = "Canonical openFerment entity schema and unit engine. The single source of truth for both."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["openferment_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 flag "ambiguous" unicode. The corpus is full of it on purpose —
# µ, ⁻¹, ×, §, °C, β — and normalising any of it would corrupt a unit string or
# a citation reference.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not installed in the repo's CI path — `pnpm check:schema` runs
# the scripts straight out of the tree — so tests resolve it the same way.
pythonpath = ["."]

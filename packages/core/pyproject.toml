[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openferment-core"
version = "0.1.0"
description = "Canonical openFerment entity schema and unit engine. The single source of truth for both."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
# sqlglot parses the DDL that `seed/` generates. There is no Postgres server in
# the repo's CI path, so an independent parser reading the emitted schema back is
# the strongest available check on the Postgres half of it; the tests that use it
# skip when it is absent, which is why it is declared rather than assumed.
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "sqlglot>=25"]

[tool.hatch.build.targets.wheel]
# `seed/` is deliberately not here, for the same reason `scripts/` is not: it is
# run out of the tree, and a top-level module named `seed` in site-packages
# would be a namespace landgrab. Import it as `seed` from `packages/core`.
packages = ["openferment_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 flag "ambiguous" unicode. The corpus is full of it on purpose —
# µ, ⁻¹, ×, §, °C, β — and normalising any of it would corrupt a unit string or
# a citation reference.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not installed in the repo's CI path — `pnpm check:schema` runs
# the scripts straight out of the tree — so tests resolve it the same way.
pythonpath = ["."]

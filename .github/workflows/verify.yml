# The regression harness, on every push and PR.
#
# CLAUDE.md invariant 1 names `pnpm verify` as THE gate for this migration, and
# until this file existed it ran only when someone remembered to run it. The
# session that added it had already watched every stage fail at least once —
# several of them exist because a gate was found watching only one side of a
# two-sided thing — so the chain is trusted the only way a chain can be.
#
# verify is twenty-one stages: a typecheck, sixteen `check:*` gates, a build and
# three browser suites. The canonical list is the `verify` script in
# package.json and is deliberately not restated here — an enumeration in a
# comment is an enumeration that goes stale, and this one did (it said
# "eleven", listed twelve, and summed to eighteen).
#
# What matters for CI is which stages have dependencies beyond node: check:seed
# and check:demo-seed run under tsx; check:corpus, check:aggregation and
# check:servers and check:schema shell out to python3 with pydantic;
# check:python runs pytest in
# both packages; and the three browser suites need the Playwright chromium.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: install Python packages (editable, with dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e 'packages/core[dev]'
          pip install -e 'packages/assay[dev]' || pip install -e packages/assay
          # The scorer half of assay needs Inspect; its tests importorskip
          # without it, which would silently shrink coverage in CI — so it is
          # installed explicitly rather than left to chance.
          pip install inspect-ai

      - name: install a browser for the smoke, golden and deep suites
        run: npx playwright install --with-deps chromium

      - name: the gate
        run: pnpm verify

      - name: python lint and strict types
        # Not stages of verify (verify runs the SUITES via check:python); kept
        # green separately so a red here is a style/typing failure, never
        # mistaken for a behaviour failure.
        run: |
          pip install 'ruff>=0.6' 'mypy>=1.11'
          ruff check packages/core packages/assay
          ruff format --check packages/core packages/assay
          (cd packages/core && mypy openferment_core seed)
          (cd packages/assay && mypy openferment_assay)
